apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-mimir
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: mimir-distributed
    targetRevision: 5.3.0 # Use the latest stable version
    helm:
      valueFiles:
        - >-
          https://raw.githubusercontent.com/its-pushpaks-world/ArgoCD/main/helm-values/mimir-values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
