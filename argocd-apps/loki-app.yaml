apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: loki-distributed
    targetRevision: 0.79.0
    helm:
      valueFiles:
        - >-
          https://raw.githubusercontent.com/its-pushpaks-world/ArgoCD/main/helm-values/loki-values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
